sonar.projectKey=Alice-CRM
sonar.projectName=Alice CRM
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Sources applicatives
sonar.sources=src,config,templates,public
sonar.tests=tests
sonar.php.file.suffixes=.php

# Exclusions
sonar.exclusions=vendor/**,var/**,public/bundles/**,public/assets/**,public/fontawesome/**,public/uploads/**,**/*.min.js,**/*.map

# PHPUnit coverage report generated by the CI with PCOV
sonar.php.coverage.reportPaths=var/coverage/clover.xml
